name: anisette-windows

# Run separately from the macOS CoreADI stack:
# docker compose -f compose.windows.yaml up --build -d
services:
  anisette:
    build:
      context: .
      dockerfile: Dockerfile.windows
    restart: unless-stopped
    environment:
      ANISETTE_BACKEND: windows
      ANISETTE_WINDOWS_COREADI_PATH: /data/CoreADI64.dll
      ANISETTE_STATE_DIR: /state
      PORT: "6969"
    ports:
      - "127.0.0.1:${ANISETTE_WINDOWS_PORT:-16969}:6969"
    volumes:
      # Files must come from an Apple Windows installer you obtained yourself.
      - ./apple-windows:/data:ro
      - anisette-windows-state:/state

volumes:
  anisette-windows-state:
