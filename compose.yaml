# Default deployment: Windows iTunes CoreADI under Wine.
# Uses the SAME Compose project, service and host port as the original Mac backend.
# The Windows state is stored in a NEW volume; existing Mac volumes remain untouched.
services:
  anisette:
    build:
      context: .
      dockerfile: Dockerfile.windows
    restart: unless-stopped
    environment:
      ANISETTE_BACKEND: windows
      ANISETTE_WINDOWS_COREADI_PATH: /data/CoreADI64.dll
      ANISETTE_STATE_DIR: /state
      PORT: "6969"
    ports:
      - "127.0.0.1:${ANISETTE_PORT:-6969}:6969"
    volumes:
      - ./apple-windows:/data:ro
      - windows-state:/state
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "curl --fail --silent http://127.0.0.1:6969/healthz > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  windows-state:
