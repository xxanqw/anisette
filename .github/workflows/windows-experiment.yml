name: Experimental Windows ADI worker

on:
  push:
    branches: [experiments/windows-coreadi-wine]
  workflow_dispatch:

jobs:
  windows-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native Windows worker
        run: docker build -f Dockerfile.windows --target windows-worker-builder .
      - name: Build and test Swift server
        run: docker build -f Dockerfile.windows --target swift-compiled .

  apple-runtime-probe:
    if: github.event_name == 'push'
    needs: [windows-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSI extractors
        run: sudo apt-get update && sudo apt-get install -y p7zip-full msitools
      - name: Download original Apple dependencies
        run: bash scripts/prepare_windows_coreadi.sh
      - name: Build experimental Linux/Wine service
        run: docker build -f Dockerfile.windows -t anisette-windows:probe .
      - name: Probe real CoreADI under Wine
        run: |
          docker run --rm -d --name anisette-win-probe -p 127.0.0.1:16969:6969 \
            -v "$PWD/apple-windows:/data:ro" anisette-windows:probe
          trap 'docker logs anisette-win-probe; docker stop anisette-win-probe' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16969/healthz >/dev/null; then break; fi
            sleep 2
          done
          if ! curl -fsS --max-time 120 http://127.0.0.1:16969/healthz/adi; then
            echo 'Direct Wine/CoreADI diagnostics (no Apple account involved):'
            docker exec anisette-win-probe id
            docker exec anisette-win-probe ls -l /data/CoreADI64.dll /usr/local/bin/anisette-win.exe /usr/bin/wine
            printf 'PING\nQUIT\n' | docker exec -i \
              -e WINEPREFIX=/state/diagnostics -e WINEARCH=win64 -e WINEDEBUG=-all \
              anisette-win-probe /usr/bin/wine /usr/local/bin/anisette-win.exe 'Z:\data\CoreADI64.dll' || true
            exit 1
          fi

  native-coreadi-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native Wine and MSI tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full msitools wine wine64 gcc-mingw-w64-x86-64
      - name: Prepare original Apple CoreADI files
        run: bash scripts/prepare_windows_coreadi.sh
      - name: Cross-compile Windows test process
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -static \
            -o "$RUNNER_TEMP/anisette-win.exe" windows/worker.c -lcrypt32
      - name: Directly initialize Apple CoreADI through Wine
        run: |
          set -o pipefail
          export WINEPREFIX="$RUNNER_TEMP/anisette-wine" WINEARCH=win64 WINEDEBUG=-all
          coreadi_path="$(winepath -w "$PWD/apple-windows/CoreADI64.dll")"
          printf 'PING\nQUIT\n' | timeout 90s wine "$RUNNER_TEMP/anisette-win.exe" "$coreadi_path"
