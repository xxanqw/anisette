name: Build and test

on:
  push:
    branches: [main, feat/swift-mac-adi]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust backend and Swift 6.4.1 app, run Swift tests
        run: docker build --progress=plain -t anisette-test .
      - name: HTTP contract smoke test (no Apple login or CoreADI required)
        shell: bash
        run: |
          mkdir -p /tmp/anisette-test-core
          head -c 8192 /dev/zero > /tmp/anisette-test-core/CoreADI.x86_64
          chmod 644 /tmp/anisette-test-core/CoreADI.x86_64
          docker run -d --name anisette-test -p 127.0.0.1:6969:6969 \
            -v /tmp/anisette-test-core:/data:ro anisette-test
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:6969/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6969/v3/client_info | jq -e \
            '.client_info | contains("com.apple.AuthKit")'
          curl -fsS -X POST http://127.0.0.1:6969/v3/get_headers \
            -H 'Content-Type: application/json' \
            -d '{"identifier":"bad","adi_pb":"bad"}' | jq -e \
            '.result == "GetHeadersError"'
          docker logs anisette-test
